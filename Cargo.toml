[package]
name = "sysfonts"
version = "0.1.0"
edition = "2021"
description = "Cross-platform system font manager exposed via C FFI"
license = "MIT"
repository = "https://github.com/dytescn/sysfonts"
homepage = "https://github.com/dytescn/sysfonts"
documentation = "https://docs.rs/sysfonts"
readme = "README.md"
keywords = ["font", "fontconfig", "ffi", "font-manager"]
categories = ["os", "api-bindings"]
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "rlib"]
name = "sysfonts"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
font-kit = "0.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "21"
core-foundation = "0.10"
